[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spathi-bench"
version = "0.1.0"
description = "Reproducible ANDREA benchmarks for SPATHI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrián Segura" }]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9",
]

[project.scripts]
spathi-bench = "spathi_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spathi_bench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: tests that execute Docker or ANDREA workflows"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "containers/spathi"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
